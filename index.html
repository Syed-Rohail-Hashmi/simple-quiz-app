<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizDeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">

  <header class="app-header">
    <span class="brand-mark">QuizDeck</span>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z"></path>
      </svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
    </button>
  </header>

  <main class="quiz-card" id="quiz-card">

    <section id="start-screen" class="screen">
      <h1 class="app-title">QuizDeck</h1>
      <p class="app-tagline">Answer a few quick questions and get instant feedback after each one. See your final score, then try to beat it.</p>
      <div id="score-summary" class="score-summary hidden">
        <div class="score-stat">
          <span class="score-stat-label">Last Score</span>
          <span class="score-stat-value" id="last-score-value">—</span>
        </div>
        <div class="score-stat">
          <span class="score-stat-label">Best Score</span>
          <span class="score-stat-value" id="best-score-value">—</span>
        </div>
      </div>
      <button id="start-btn" class="btn btn-primary" type="button">Start Quiz</button>
    </section>

    <section id="question-screen" class="screen hidden">
      <div class="quiz-meta">
        <span id="question-counter" class="question-counter">Question 1 of 5</span>
        <div class="progress-track" id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Quiz progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <h2 id="question-text" class="question-text"></h2>

      <div id="options-list" class="options" role="group" aria-label="Answer options"></div>

      <p class="keyboard-hint">Tip: press 1–4 to answer, Enter to continue</p>

      <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </section>

    <section id="result-screen" class="screen hidden">
      <h2 class="result-heading" id="result-heading">Quiz Complete!</h2>
      <p id="score-display" class="score-display"></p>
      <p id="result-message" class="result-message"></p>

      <div id="review-list" class="review-list"></div>

      <button id="restart-btn" class="btn btn-primary" type="button">Restart Quiz</button>
    </section>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
